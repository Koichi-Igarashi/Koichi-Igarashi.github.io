  - date: 2022-12
    ja: '**五十嵐公一**・和田哲 "イソへラムシは不動行動で魚類捕食者からの捕食を回避する" 2022年度日本生態学会北海道地区大会，オンライン．2022年12月 (口頭)．**若手研究奨励賞受賞**'
    en: '**Koichi Igarashi**, Satoshi Wada "*Cleantiella isopus* avoids predation by fish through immobility", 2022 Hokkaido Regional Meeting of the Ecological Society of Japan, online, Dec 2022 (oral, in Japanese). **Young Researcher Encouragement Award**'  # review
