    ja: '**五十嵐公一** "ヘラムシの柔軟な行動防御 ～防御タイミングの意味とは？～", 自由集会「食べられそうになってからが本番？：捕食者との接触後にはたらく多様な防衛戦略」, 第73回日本生態学会大会, 京都, 2026年3月 (口頭)．'
    en: '**Koichi Igarashi** "Flexible behavioral defenses in idoteid isopods: what does the timing of defense mean?", Free session "The real game starts when you are about to be eaten? Diverse defense strategies after contact with predators", the 73rd Annual Meeting of the Ecological Society of Japan, Kyoto, Mar 2026 (oral, in Japanese).'  # review
  - date: 2025-11
    ja: '**五十嵐公一**・関岡寛知 "海浜の節足動物は荒天時に安全な陸地へ集団避難する" 2025日本動物行動学会第44回大会, 函館, 2025年11月 (口頭)．'
