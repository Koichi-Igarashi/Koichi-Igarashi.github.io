  - date: 2024-12
    ja: '**五十嵐公一** "意外と洗練されているヘラムシの身を守る術" 2024甲殻類学会第62回大会, 公開シンポジウム「エビでもカニでもない！！ 海にすむ小さな甲殻類の行動と社会」, 函館, 2024年12月 (口頭)．'
