project:
  type: website
  post-render:
    - scripts/cleanup_publish_files.R
  render:
    - "*.qmd"
    # Research (about*.qmd) and Posts (posts*.qmd, posts/) are kept in the
    # repository but not published. To publish them again, remove the two
    # lines below, add the pages back to the navbars in _quarto-ja.yml /
    # _quarto-en.yml and list the posts to publish (e.g. "posts/test/index.qmd").
    - "!about.qmd"
    - "!posts.qmd"
    - "!posts/"
    - "!legacy-redirect/"

# Navigation menus live in _quarto-ja.yml and _quarto-en.yml.
# Quarto concatenates lists across profiles, so a navbar here would be
# duplicated in every language.
website:
  # Public URL of the site (no trailing slash). Change this one line if the
  # site moves, e.g. to https://koichi-igarashi.github.io or a custom domain.
  site-url: "https://koichi-igarashi.github.io/website"
  google-analytics: "G-HCK5G6DBKK"
  title: "Koichi Igarashi"
  description: "北海道大学大学院水産科学院の大学院生・五十嵐公一（Koichi Igarashi）の研究者ウェブサイトです．海産等脚類を対象に，捕食者–被食者相互作用などの行動生態学を研究しています．"
  image: images/og-image.jpg
  page-footer: "Copyright 2025, Koichi Igarashi"
  open-graph: true
  twitter-card:
    creator: "@igapije"

format:
  html:
    theme: flatly
    toc: true
    css: styles.css
    include-after-body:
      - scripts/pdf-download-tracking.html
    mainfont: Helvetica Neue, Arial, Hiragino Kaku Gothic ProN, Hiragino Sans

lang: ja

# Multilingual rendering with babelquarto (https://docs.ropensci.org/babelquarto/).
# Japanese pages are `name.qmd`; English translations are `name.en.qmd`.
# Build with `Rscript scripts/build.R` (see README.md).
babelquarto:
  languagelinks: navbar
  mainlanguage: ja
  languages:
    - en
  languagecodes:
    - name: ja
      text: "日本語"
    - name: en
      text: "English"
title-en: "Koichi Igarashi"
description-en: "Personal website of Koichi Igarashi, a graduate student at the Graduate School of Fisheries Sciences, Hokkaido University, studying behavioural ecology and predator–prey interactions in marine isopods."
